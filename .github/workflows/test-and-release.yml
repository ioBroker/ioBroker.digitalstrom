# This is a composition of lint and test scripts
# Make sure to update this file along with the others

name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
  push:
    branches:
      - '*'
    tags:
      # normal versions
      - "v?[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v?[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}
  # Lets the release be rebuilt for an existing tag without moving that tag.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build the release from, for example v2.4.9
        required: true

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}


      - name: Install Dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Type check the admin sources
        run: npm run check:admin

      - name: Test package files
        run: npm run test:package

  # Runs adapter tests on all supported node versions and OSes
  adapter-tests:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    needs: [check-and-lint]

    runs-on: ${{ matrix.os }}
    strategy:
      # One wobbly leg used to cancel the others, so a flaky windows run hid whether the
      # remaining combinations were fine. Every combination now reports its own result.
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:js

      - name: Run integration tests # (linux/osx)
        if: startsWith(runner.OS, 'windows') == false
        run: DEBUG=testing:* npm run test:integration
      - name: Run integration tests # (windows)
        if: startsWith(runner.OS, 'windows')
        run: set DEBUG=testing:* & npm run test:integration

  # Deploys the final package to NPM
  deploy:
    needs: [check-and-lint, adapter-tests]

    # Trigger this step only when a commit is tagged with a version number
    if: |
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.head_commit.message, '[skip ci]') == false &&
       github.event_name == 'push' &&
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    # Write permission is required to create the Github release. No id-token here:
    # this fork does not publish to npm, see the note at the release step below.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # the annotated tag carries the release notes
          fetch-depth: 0

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Extract the version and the release notes from the tag
        id: extract_release
        # The release notes are the message of the annotated tag, so they can be written
        # deliberately instead of reusing whatever the last commit message happened to be.
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.tag || github.ref }}"
          VERSION=${VERSION##*/}
          VERSION=${VERSION#v}
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          # On a tag push actions/checkout fetches the commit and writes it straight to
          # refs/tags/<tag>, so the tag is lightweight here and the annotated object is
          # missing. Reading it would then silently yield the commit message instead of
          # the release notes, which is why the real ref is fetched again.
          git fetch --force origin "refs/tags/v$VERSION:refs/tags/v$VERSION"

          if [ "$(git cat-file -t "v$VERSION")" = "tag" ]; then
            # In a raw tag object the message starts after the first empty line.
            NOTES=$(git cat-file tag "v$VERSION" | sed '1,/^$/d')
          else
            echo "::warning::v$VERSION is not an annotated tag, using the commit body"
            NOTES=$(git log -1 --format=%B)
          fi

          if [ -z "${NOTES//[[:space:]]/}" ]; then
            echo "::error::refusing to publish a release without notes"
            exit 1
          fi

          # Handed to the next step as a file, so no quoting or escaping can mangle it.
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          echo "wrote $(wc -l < "$RUNNER_TEMP/release-notes.md") lines of release notes"

      # Deliberately NO "npm publish" here. The npm package name iobroker.digitalstrom
      # belongs to the upstream project (maintainers bluefox and apollon77), so publishing
      # from this fork is not possible. Installation happens through the GitHub URL:
      #   iobroker url https://github.com/mrandreschmitz/ioBroker.digitalstrom
      #
      # The release is written with the gh CLI instead of a third party action. An action
      # that only creates the release left the body of an already existing release
      # untouched, so a rebuilt release kept the notes of its first run. "gh release edit"
      # states plainly what should be there and overwrites it.
      - name: Create or update the Github release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.extract_release.outputs.VERSION }}
        run: |
          set -euo pipefail
          # A version containing a hyphen is a pre-release, for example v1.2.3-beta.1
          case "$VERSION" in
            *-*) FLAGS=(--prerelease) ;;
            *)   FLAGS=(--latest) ;;
          esac

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION exists, updating it"
            gh release edit "v$VERSION" \
              --title "Release v$VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --draft=false "${FLAGS[@]}"
          else
            echo "creating release v$VERSION"
            gh release create "v$VERSION" \
              --title "Release v$VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag "${FLAGS[@]}"
          fi

          # Read the release back instead of trusting the exit code. This is a report,
          # never a reason to fail: for 2.4.10 the release was created correctly and only
          # this line turned the job red, which would hide a real failure next time.
          gh release view "v$VERSION" --json name,tagName,isDraft \
            --jq '"published \(.name), tag \(.tagName), draft \(.isDraft)"' \
            || echo "::warning::the release was created, but reading it back did not work"
